name: Portfolio validation
on:
  push:
    branches: [main, feat/visual-portfolio-projects-2026]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/js/portfolio-projects.js
      - name: Portfolio structure and content
        run: node scripts/check-portfolio.mjs
